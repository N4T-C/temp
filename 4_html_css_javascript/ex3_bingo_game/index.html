<!DOCTYPE html>
<html>
<head>
  <title>Two Player Bingo Game</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20px; }
    .boards { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
    .grid { display: grid; grid-template-columns: repeat(5, 45px); gap: 4px; margin-top: 10px; }
    .cell {
      width: 45px; height: 45px; border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; background-color: #fff;
    }
    .marked { background-color: #4caf50; color: white; }
    #msg { font-size: 18px; font-weight: bold; margin: 15px 0; color: #1565c0; }
  </style>
</head>
<body>
  <h2>Two Player Bingo Game</h2>

  <div>
    <button onclick="startGame()">Start</button>
    <button onclick="resetGame()">Reset</button>
  </div>
  <br>
  <div>
    <input type="number" id="numInput" min="1" max="25" placeholder="1-25">
    <button onclick="markNumber()">Mark</button>
  </div>

  <p id="msg">Click Start to play!</p>

  <div class="boards">
    <div>
      <h3>Player 1</h3>
      <div id="grid1" class="grid"></div>
    </div>
    <div>
      <h3>Player 2</h3>
      <div id="grid2" class="grid"></div>
    </div>
  </div>

  <script>
    let p1Nums = [], p2Nums = [];
    let p1Marked = [], p2Marked = [];
    let gameOver = false;

    // Generate random 1-25 shuffled array
    function shuffle() {
      let arr = Array.from({length: 25}, (_, i) => i + 1);
      for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderGrids() {
      const g1 = document.getElementById('grid1');
      const g2 = document.getElementById('grid2');
      g1.innerHTML = ''; g2.innerHTML = '';

      for (let i = 0; i < 25; i++) {
        g1.innerHTML += `<div class="cell ${p1Marked[i] ? 'marked' : ''}">${p1Nums[i] || ''}</div>`;
        g2.innerHTML += `<div class="cell ${p2Marked[i] ? 'marked' : ''}">${p2Nums[i] || ''}</div>`;
      }
    }

    function startGame() {
      p1Nums = shuffle();
      p2Nums = shuffle();
      p1Marked = new Array(25).fill(false);
      p2Marked = new Array(25).fill(false);
      gameOver = false;
      document.getElementById('msg').innerText = "Game started! Enter a number and click Mark.";
      renderGrids();
    }

    function resetGame() {
      p1Nums = []; p2Nums = [];
      p1Marked = []; p2Marked = [];
      gameOver = false;
      document.getElementById('numInput').value = '';
      document.getElementById('msg').innerText = "Game reset. Click Start to play.";
      renderGrids();
    }

    function checkWin(marked) {
      // Check 5 rows & 5 columns
      for (let i = 0; i < 5; i++) {
        if ([0,1,2,3,4].every(c => marked[i * 5 + c])) return true; // Row
        if ([0,1,2,3,4].every(r => marked[r * 5 + i])) return true; // Col
      }
      // Check 2 diagonals
      if ([0,6,12,18,24].every(i => marked[i])) return true;
      if ([4,8,12,16,20].every(i => marked[i])) return true;
      return false;
    }

    function markNumber() {
      if (gameOver || p1Nums.length === 0) return;
      const val = parseInt(document.getElementById('numInput').value);
      if (!val || val < 1 || val > 25) { alert("Enter a valid number between 1 and 25"); return; }

      const idx1 = p1Nums.indexOf(val);
      if (idx1 !== -1) p1Marked[idx1] = true;

      const idx2 = p2Nums.indexOf(val);
      if (idx2 !== -1) p2Marked[idx2] = true;

      renderGrids();

      const win1 = checkWin(p1Marked);
      const win2 = checkWin(p2Marked);

      if (win1 && win2) {
        document.getElementById('msg').innerText = "It's a Tie! BINGO!";
        gameOver = true;
      } else if (win1) {
        document.getElementById('msg').innerText = "Player 1 wins! BINGO!";
        gameOver = true;
      } else if (win2) {
        document.getElementById('msg').innerText = "Player 2 wins! BINGO!";
        gameOver = true;
      }
      document.getElementById('numInput').value = '';
    }
  </script>
</body>
</html>
