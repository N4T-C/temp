<!DOCTYPE html>
<html>
<head>
  <title>Student Registration & Validation</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
    .error { color: red; font-size: 13px; margin-top: 2px; }
    button { background: #1976d2; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Student Registration Form</h2>

  <form id="regForm" onsubmit="return validateForm()">
    <div class="form-group">
      <label>Full Name:</label>
      <input type="text" id="name" placeholder="John Doe">
      <div id="nameErr" class="error"></div>
    </div>

    <div class="form-group">
      <label>Email Address:</label>
      <input type="text" id="email" placeholder="name@domain.com">
      <div id="emailErr" class="error"></div>
    </div>

    <div class="form-group">
      <label>Mobile Number (10 Digits):</label>
      <input type="text" id="phone" placeholder="9876543210">
      <div id="phoneErr" class="error"></div>
    </div>

    <div class="form-group">
      <label>Department:</label>
      <select id="dept">
        <option value="">--Select Department--</option>
        <option value="CSE">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="ECE">Electronics</option>
      </select>
      <div id="deptErr" class="error"></div>
    </div>

    <button type="submit">Submit Form</button>
  </form>

  <script>
    function validateForm() {
      let isValid = true;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const dept = document.getElementById('dept').value;

      // Reset errors
      document.querySelectorAll('.error').forEach(el => el.innerText = '');

      // 1. Name validation
      if (name.length < 3) {
        document.getElementById('nameErr').innerText = "Name must be at least 3 characters";
        isValid = false;
      }

      // 2. Email validation (basic pattern)
      if (!email.includes('@') || !email.includes('.')) {
        document.getElementById('emailErr').innerText = "Enter a valid email (must contain @ and .)";
        isValid = false;
      }

      // 3. Mobile phone validation (exactly 10 digits)
      if (!/^\d{10}$/.test(phone)) {
        document.getElementById('phoneErr').innerText = "Mobile number must be exactly 10 digits";
        isValid = false;
      }

      // 4. Department validation
      if (!dept) {
        document.getElementById('deptErr').innerText = "Please select a department";
        isValid = false;
      }

      if (isValid) {
        alert("Registration Successful for: " + name);
      }
      return false; // prevent page refresh
    }
  </script>
</body>
</html>
